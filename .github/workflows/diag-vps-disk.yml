name: Diag VPS disk (temporary)

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Configure pinned VPS access
        shell: bash
        env:
          VPS_SSH_HOST_KEY: ${{ vars.VPS_SSH_HOST_KEY }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/handleplan_deploy
          chmod 600 ~/.ssh/handleplan_deploy
          printf '%s\n' "$VPS_SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/handleplan_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes deploy@198.23.137.16 true

      - name: Prune unused images and report VPS disk state
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/handleplan_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
            deploy@198.23.137.16 '
            echo "== prune unused docker images (protecting handleplan, rollback tags, container images) =="
            used=/tmp/handleplan-used-images.$$
            docker ps -aq | xargs -r docker inspect -f "{{.Image}}" | sort -u > "$used"
            docker images --format "{{.ID}} {{.Repository}}:{{.Tag}}" |
              awk "\$2 ~ /^handleplan:/ || \$2 ~ /:rollback\$/ {print \$1}" | sort -u >> "$used"
            freed=0
            for id in $(docker images -q | sort -u); do
              grep -qx "$id" "$used" && continue
              docker rmi "$id" >/dev/null 2>&1 && freed=$((freed + 1)) || true
            done
            rm -f "$used"
            echo "removed $freed unused image ids"
            echo "== handleplan containers =="
            docker ps -a --filter "name=handleplan" --format "{{.Names}} {{.Image}} {{.Status}}"
            echo "== recent worker logs =="
            worker_container=$(docker ps -aq --filter name=handleplan-worker | head -1)
            echo "worker container: $worker_container"
            docker logs --tail 200 --timestamps "$worker_container" 2>&1 || true
            echo "== worker internal health =="
            curl -s -m 5 http://localhost:8787/health 2>&1 || curl -s -m 5 http://localhost:9090/health 2>&1 || true
            echo "== recent ingestion runs =="
            docker exec handleplan-postgres-1 psql -U handleplan -d handleplan -c \
              "select run_type, status, started_at, completed_at, counts from ingestion_runs order by started_at desc limit 8;"
            echo "== recent worker job results =="
            docker exec handleplan-postgres-1 psql -U handleplan -d handleplan -c \
              "select job_kind, status, scheduled_at, started_at, completed_at, counts from worker_job_results order by started_at desc limit 8;"
            echo "== catalog run error details =="
            docker exec handleplan-postgres-1 psql -U handleplan -d handleplan -c \
              "select run_type, status, counts, error_class from ingestion_runs where run_type = \$\$catalog\$\$ order by started_at desc limit 3;"
            echo "== latest postgres errors =="
            docker logs --tail 400 handleplan-postgres-1 2>&1 | grep -i -A3 "error\|constraint\|violat" | tail -40 || true
            echo "== data_sources =="
            docker exec handleplan-postgres-1 psql -U handleplan -d handleplan -c \
              "select id, runtime_state from data_sources;"
            echo "== source_permissions =="
            docker exec handleplan-postgres-1 psql -U handleplan -d handleplan -c \
              "select source_id, decision, reviewed_at, valid_until, permissions, notes from source_permissions where source_id = \$\$kassalapp\$\$ order by id desc limit 3;"
            echo "== data_sources permission fields =="
            docker exec handleplan-postgres-1 psql -U handleplan -d handleplan -c \
              "select id, runtime_state, permission_reviewed_at, permission_expires_at, kill_switch_reason from data_sources where id = \$\$kassalapp\$\$;"
            echo "== probe kassal.app products endpoint =="
            . /opt/apps/handleplan/shared/production.env 2>/dev/null || true
            curl -s -o /tmp/kassal-products.json -w "http_status=%{http_code} time=%{time_total}s size=%{size_download}\n" -m 20 \
              -H "Authorization: Bearer ${KASSAL_API_KEY:-missing}" \
              "https://kassal.app/api/v1/products?page=1&size=100&sort=date_desc&unique=1&exclude_without_ean=1"
            head -c 1200 /tmp/kassal-products.json
            echo
            rm -f /tmp/kassal-products.json
            echo "== product counts =="
            docker exec handleplan-postgres-1 psql -U handleplan -d handleplan -c \
              "select (select count(*) from source_products) as source_products, (select count(*) from canonical_products) as canonical_products, (select count(*) from catalog_observations) as catalog_observations;"
            echo "== reproduce product normalization =="
            worker_container=$(docker ps -aq --filter name=handleplan-worker | head -1)
            docker exec "$worker_container" node --input-type=module -e \
              "$(base64 -d <<< )"
            echo "== df -h =="
            df -h /
            echo "== df /opt/apps/handleplan =="
            df -h /opt/apps/handleplan
            echo "== docker system df =="
            docker system df
            echo "== docker images =="
            docker images --format "{{.Repository}}:{{.Tag}} {{.ID}} {{.Size}}"
            echo "== /opt/apps/handleplan du =="
            du -sh /opt/apps/handleplan/* 2>/dev/null || true
            echo "== docker data dir du =="
            sudo -n du -sh /var/lib/docker 2>/dev/null || du -sh /var/lib/docker 2>/dev/null || true
            echo "== journald =="
            sudo -n journalctl --disk-usage 2>/dev/null || journalctl --disk-usage 2>/dev/null || true
          '
