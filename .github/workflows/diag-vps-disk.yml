name: Diag VPS (temporary)

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Configure pinned VPS access
        shell: bash
        env:
          VPS_SSH_HOST_KEY: ${{ vars.VPS_SSH_HOST_KEY }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/handleplan_deploy
          chmod 600 ~/.ssh/handleplan_deploy
          printf '%s\n' "$VPS_SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/handleplan_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes deploy@198.23.137.16 true

      - name: Inspect price outcome reasons
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/handleplan_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
            deploy@198.23.137.16 '
            echo "== price outcome reasons (latest benchmark run) =="
            docker exec handleplan-postgres-1 psql -U handleplan -d handleplan -c \
              "select o.outcome_state, o.reason, o.subject_chain, count(*) from source_record_outcomes o inner join ingestion_runs r on r.id = o.ingestion_run_id where r.run_type = \$\$benchmark-prices\$\$ and r.started_at = (select max(started_at) from ingestion_runs where run_type = \$\$benchmark-prices\$\$) group by 1,2,3 order by 4 desc;"
            echo "== benchmark targets =="
            docker exec handleplan-postgres-1 psql -U handleplan -d handleplan -c \
              "select identifier.value as ean from product_identifiers identifier join canonical_products product on product.id = identifier.product_id where identifier.scheme in (\$\$ean8\$\$,\$\$ean13\$\$) and identifier.verified_at is not null and product.status = \$\$active\$\$ order by identifier.value limit 10;"
            echo "== benchmark target live prices =="
            python3 -c "$(base64 -d <<< )" 2>&1 || echo "probe failed"
          '
