name: Diag VPS (temporary)

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Configure pinned VPS access
        shell: bash
        env:
          VPS_SSH_HOST_KEY: ${{ vars.VPS_SSH_HOST_KEY }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/handleplan_deploy
          chmod 600 ~/.ssh/handleplan_deploy
          printf '%s\n' "$VPS_SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/handleplan_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes deploy@198.23.137.16 true

      - name: Inspect deploy state
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/handleplan_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
            deploy@198.23.137.16 '
            echo "== state dir =="
            ls -la /opt/apps/handleplan/state/ 2>&1 || true
            echo "== current-deployment =="
            cat /opt/apps/handleplan/state/current-deployment 2>&1 || true
            echo "== current-revision =="
            cat /opt/apps/handleplan/state/current-revision 2>&1 || true
            echo "== pending-deployment =="
            ls -la /opt/apps/handleplan/state/pending-deployment 2>&1 || true
            echo "== deploy bundles =="
            ls -la /opt/apps/handleplan/deploy-bundles/ 2>&1 | head -20
            echo "== deploy-control-staging =="
            ls -la /opt/apps/handleplan/deploy-control-staging/ 2>&1 | head -10
          '
