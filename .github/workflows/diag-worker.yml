name: Diag worker (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VPS_SSH_HOST_KEY: ${{ vars.VPS_SSH_HOST_KEY }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
    steps:
      - name: Configure pinned VPS access
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_HOST_KEY"
          test -n "$VPS_SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/handleplan_deploy
          chmod 600 ~/.ssh/handleplan_deploy
          printf '%s\n' "$VPS_SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/handleplan_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes deploy@198.23.137.16 true
      - name: Read worker diagnostics
        run: |
          ssh -i ~/.ssh/handleplan_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
            deploy@198.23.137.16 '
          set -u
          echo "--- docker ps ---"
          docker ps --format "{{.Names}} | {{.Status}}" | grep handleplan || true
          echo "--- worker env access ---"
          docker exec handleplan-worker-1 sh -c "printf \"KASSAL_SOURCE_ACCESS=%s\n\" \"\${KASSAL_SOURCE_ACCESS:-<unset>}\"; printf \"APP_COMMIT_SHA=%s\n\" \"\${APP_COMMIT_SHA:-<unset>}\"" 2>&1 || true
          echo "--- worker logs tail ---"
          docker logs --tail 150 handleplan-worker-1 2>&1 || true
          echo "--- worker health ---"
          docker exec handleplan-worker-1 wget -qO- http://127.0.0.1:3005/health 2>&1 || true
          echo
          echo "--- worker restart details ---"
          docker inspect handleplan-worker-1 --format "RestartCount={{.RestartCount}} ExitCode={{.State.ExitCode}} OOM={{.State.OOMKilled}} Status={{.State.Status}} StartedAt={{.State.StartedAt}}" 2>&1 || true
          echo "--- worker process state ---"
          docker top handleplan-worker-1 2>&1 || true
          echo "--- database worker scheduling state ---"
          export PGPASSWORD=$(grep "^POSTGRES_PASSWORD=" /opt/apps/handleplan/shared/production.env | cut -d= -f2-)
          docker exec handleplan-postgres-1 env PGPASSWORD="$PGPASSWORD" psql -X --no-password -h 127.0.0.1 -U handleplan -d handleplan -c "select source_id, job_kind, scheduled_at, status from worker_job_results order by scheduled_at desc limit 12" 2>&1 || true
          docker exec handleplan-postgres-1 env PGPASSWORD="$PGPASSWORD" psql -X --no-password -h 127.0.0.1 -U handleplan -d handleplan -c "select source_id, status, recorded_at, last_discovery_success_at, last_capture_success_at from source_health_snapshots order by recorded_at desc limit 6" 2>&1 || true
          docker exec handleplan-postgres-1 env PGPASSWORD="$PGPASSWORD" psql -X --no-password -h 127.0.0.1 -U handleplan -d handleplan -c "select source_id, status, started_at, completed_at from ingestion_runs order by started_at desc limit 8" 2>&1 || true
          '
