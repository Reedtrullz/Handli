name: Diag worker (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VPS_SSH_HOST_KEY: ${{ vars.VPS_SSH_HOST_KEY }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
    steps:
      - name: Configure pinned VPS access
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_HOST_KEY"
          test -n "$VPS_SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/handleplan_deploy
          chmod 600 ~/.ssh/handleplan_deploy
          printf '%s\n' "$VPS_SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/handleplan_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes deploy@198.23.137.16 true
      - name: Read worker failure diagnostics
        run: |
          ssh -i ~/.ssh/handleplan_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
            deploy@198.23.137.16 '
          set -u
          echo "--- worker health ---"
          docker exec handleplan-worker-1 wget -qO- http://127.0.0.1:3005/health 2>&1 || true
          echo
          echo "--- kassal upstream from VPS ---"
          key=$(grep "^KASSAL_API_KEY=" /opt/apps/handleplan/shared/production.env | cut -d= -f2-)
          curl -s -m 15 -o /tmp/kassal-probe.json -w "http=%{http_code} time=%{time_total}\n" -H "Authorization: Bearer $key" "https://kassal.app/api/v1/products?limit=1" 2>&1 || true
          head -c 120 /tmp/kassal-probe.json 2>/dev/null || true
          echo
          echo "--- database failure detail ---"
          export PGPASSWORD=$(grep "^POSTGRES_PASSWORD=" /opt/apps/handleplan/shared/production.env | cut -d= -f2-)
          docker exec handleplan-postgres-1 env PGPASSWORD="$PGPASSWORD" psql -X --no-password -h 127.0.0.1 -U handleplan -d handleplan -c "select job_id, job_kind, scheduled_at, status, counts, started_at, completed_at from worker_job_results order by scheduled_at desc limit 3" 2>&1 || true
          docker exec handleplan-postgres-1 env PGPASSWORD="$PGPASSWORD" psql -X --no-password -h 127.0.0.1 -U handleplan -d handleplan -c "select run_type, status, error_class, counts, started_at, completed_at from ingestion_runs where source_id = '"'"'kassalapp'"'"' order by started_at desc limit 4" 2>&1 || true
          '
